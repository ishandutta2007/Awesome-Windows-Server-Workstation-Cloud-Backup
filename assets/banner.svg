<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 340"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0c1938"/><stop offset="100%" stop-color="#070c18"/></linearGradient><linearGradient id="flowGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".8"/><stop offset="50%" stop-color="#4facfe" stop-opacity=".9"/><stop offset="100%" stop-color="#7f00ff" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="subtleGlow" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.3}50%{transform:translateY(-15px) translateX(10px);opacity:.8}}@keyframes dashCycle{0%{stroke-dashoffset:0}}@keyframes orbitNode{0%{transform:rotate(0deg) translateX(35px) rotate(0deg)}}.title-text{font-weight:800;font-size:38px;fill:#fff;letter-spacing:-.5px}.badge-pill-text,.desc-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:500;font-size:16px;fill:#00f2fe;letter-spacing:2px;text-transform:uppercase}.desc-text{font-weight:400;font-size:14px;fill:#94a3b8}.badge-pill-text{font-size:12px;font-weight:600;fill:#e2e8f0}.pulse-layer{animation:pulseGlow 5s ease-in-out infinite;transform-origin:960px 170px}.flow-stream{stroke-dasharray:8 12;animation:dashCycle 8s linear infinite}.flow-stream-reverse{stroke-dasharray:6 10;animation:dashCycle 6s linear infinite reverse}.particle-1{animation:floatParticle 4s ease-in-out infinite}.particle-2{animation:floatParticle 6s ease-in-out infinite 1s}.particle-3{animation:floatParticle 5s ease-in-out infinite 2s}</style><rect width="1200" height="340" fill="url(#bgGrad)" rx="16"/><g stroke="#fff" stroke-width="1" opacity=".08"><line x1="0" x2="1200" y1="68" y2="68"/><line x1="0" x2="1200" y1="136" y2="136"/><line x1="0" x2="1200" y1="204" y2="204"/><line x1="0" x2="1200" y1="272" y2="272"/><line x1="240" x2="240" y1="0" y2="340"/><line x1="480" x2="480" y1="0" y2="340"/><line x1="720" x2="720" y1="0" y2="340"/><line x1="960" x2="960" y1="0" y2="340"/></g><g class="pulse-layer"><circle cx="960" cy="170" r="110" fill="#00f2fe" filter="url(#glow)" opacity=".12"/><circle cx="960" cy="170" r="70" fill="#7f00ff" filter="url(#glow)" opacity=".18"/></g><g><path fill="none" stroke="url(#flowGrad)" stroke-width="2.5" d="M 810 240 C 870 240, 890 190, 930 180" class="flow-stream"/><path fill="none" stroke="url(#flowGrad)" stroke-width="2.5" d="M 810 100 C 870 100, 890 150, 930 160" class="flow-stream-reverse"/><path fill="none" stroke="#38bdf8" stroke-dasharray="4 6" stroke-width="2" d="M 990 170 C 1040 170, 1070 170, 1110 170" class="flow-stream" opacity=".8"/></g><g><circle cx="860" cy="140" r="3" fill="#00f2fe" class="particle-1"/><circle cx="900" cy="220" r="2.5" fill="#a78bfa" class="particle-2"/><circle cx="1060" cy="130" r="3" fill="#38bdf8" class="particle-3"/><circle cx="1040" cy="210" r="2" fill="#00f2fe" class="particle-1"/></g><g><g transform="translate(730, 75)"><rect width="80" height="50" fill="#132347" stroke="#38bdf8" stroke-width="1.5" rx="8"/><line x1="740" x2="790" y1="92" y2="92" stroke="#38bdf8" stroke-width="2"/><line x1="740" x2="790" y1="102" y2="102" stroke="#38bdf8" stroke-width="2"/><circle cx="798" cy="92" r="2" fill="#22c55e"/><circle cx="798" cy="102" r="2" fill="#22c55e"/><text x="40" y="32" fill="#94a3b8" font-family="sans-serif" font-size="10" fon